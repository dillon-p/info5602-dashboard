name: Refresh data and deploy dashboard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Download the published snapshot for code changes
        if: github.event_name == 'push'
        run: npm run data:download

      - name: Refresh Colorado ECHO snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          ECHO_API_TOKEN: ${{ secrets.ECHO_API_TOKEN }}
        run: python scripts/refresh_data.py

      - name: Test refresh and snapshot shaping
        run: npm test

      - name: Install dependencies
        run: npm ci

      - name: Lint and build dashboard
        run: |
          npm run lint
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
